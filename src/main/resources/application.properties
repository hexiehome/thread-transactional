transactional.client.port=6790
server.port=${transactional.client.port}

# Database
spring.datasource.transactional.name=transactional
spring.datasource.transactional.url=${TX_DB_URL:jdbc:mysql://127.0.0.1:3306/transactional?characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=UTC}
spring.datasource.transactional.username=${TX_DB_USERNAME:root}
spring.datasource.transactional.password=${TX_DB_PASSWORD:root}
spring.datasource.transactional.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.transactional.type=com.alibaba.druid.pool.DruidDataSource

# Pool
spring.datasource.initialSize=5
spring.datasource.minIdle=2
spring.datasource.maxActive=20
spring.datasource.maxWait=5000
spring.datasource.validationQuery=SELECT 1
spring.datasource.testWhileIdle=true

# Scenario control
transactional.coordination.timeout-seconds=10

# OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs